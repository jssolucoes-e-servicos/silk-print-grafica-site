  <text x="175" y="86" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-1">SilkPrint</text>
  <text x="178" y="128" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#00a8e8" letter-spacing="14">GRÁFICA</text>
